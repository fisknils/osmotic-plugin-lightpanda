name: Test

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The test runner needs Node.js 21 or later for its file glob, and the plugin needs the global WebSocket
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v6
      # @lightpanda/browser's install script skips its download when LIGHTPANDA_EXECUTABLE_PATH is
      # set, and the plugin and the tests start that binary. The script's download fails silently
      # on runners (its unauthenticated GitHub API call), so it's downloaded with the workflow's token.
      - name: Download Lightpanda
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bin="$RUNNER_TEMP/lightpanda"
          gh release download nightly --repo lightpanda-io/browser --pattern lightpanda-x86_64-linux --output "$bin"
          chmod +x "$bin"
          "$bin" version
          echo "LIGHTPANDA_EXECUTABLE_PATH=$bin" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test

  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
