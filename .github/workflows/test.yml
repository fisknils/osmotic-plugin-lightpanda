name: Test

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The test runner needs Node.js 21 or later for its file glob, and the plugin needs the global WebSocket
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # Also downloads the Lightpanda binary, in @lightpanda/browser's install script
      - run: npm ci
      # The install script doesn't fail npm ci when the download fails, so check for the binary here
      - name: Check the Lightpanda binary
        run: ~/.cache/lightpanda-node/lightpanda version
      - run: npm test

  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
